name: Flow Tests — Update Baselines

# Manual-dispatch workflow for regenerating Playwright screenshot
# baselines inside the pinned CI base image (the only authoritative
# environment — see playwright.config.ts). Triggered from the GitHub UI
# (Actions → Flow Tests — Update Baselines → Run workflow) or the
# `gh workflow run` CLI. The workflow opens a PR with the new
# `*-linux.png` baselines; the author reviews the pixel diff against
# their intentional UI change and merges.
#
# Why not auto-run on every push? Baselines are meant to be
# intentional — each update should have reviewable context. A manual
# trigger keeps pixel-diff drift from sneaking in silently.

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to regenerate baselines against (defaults to current)'
        required: false

# Queue (don't cancel) — baseline generation is expensive and
# interrupting leaves the PR branch half-updated.
concurrency:
  group: flow-tests-update-${{ github.event.inputs.target_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  update-baselines:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/lace-cloud/vs-code-extension-ci:playwright-v1.59.1-jammy
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.target_branch || github.ref_name }}

      - uses: ./.github/actions/download-lace-bundle
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-bucket: ${{ secrets.R2_TEST_BUNDLE_BUCKET }}
          r2-access-key-id: ${{ secrets.R2_TEST_BUNDLE_READ_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_TEST_BUNDLE_READ_SECRET_ACCESS_KEY }}

      - uses: ./.github/actions/setup-workspace
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build extension bundles
        run: pnpm run build

      - name: Regenerate Playwright baselines
        env:
          CI: '1'
          LACE_CLI_REPO: /tmp/lace-test
        run: pnpm flow-tests:update

      - name: Open PR with refreshed baselines
        uses: peter-evans/create-pull-request@v7
        with:
          branch: flow-tests/refresh-baselines
          delete-branch: true
          title: 'test(flow): refresh Playwright Linux baselines'
          body: |
            Auto-generated baseline refresh from the pinned CI image
            (`ghcr.io/lace-cloud/vs-code-extension-ci:playwright-v1.59.1-jammy`).

            **Triggered by:** @${{ github.actor }} via manual workflow dispatch.
            **Target branch:** `${{ github.event.inputs.target_branch || github.ref_name }}`

            Review the pixel diff — it should match the intentional UI
            change this PR backs. If the diff includes unexpected
            regions, hold off merging and investigate.
          commit-message: 'test(flow): refresh Playwright Linux baselines'
          add-paths: tests/flow/__snapshots__/**/*-linux.png
