name: Image

# Builds and publishes ghcr.io/lace-cloud/vs-code-extension-ci — the
# container our Playwright-based jobs and the local devcontainer both use.
# Only runs when the Dockerfile or this workflow itself changes, so the
# publish cost (≈6 min for a fresh multi-arch build, ≈2 min cached) is
# rare. Manual `workflow_dispatch` is available for force-rebuilds.

on:
  push:
    branches: [main]
    paths:
      - '.github/docker/ci-base/**'
      - '.github/workflows/image.yml'
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/vs-code-extension-ci
          tags: |
            type=raw,value=playwright-v1.59.1-jammy
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .github/docker/ci-base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
