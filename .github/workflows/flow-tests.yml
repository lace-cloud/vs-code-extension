name: Flow Tests

# Playwright golden-path tests against Storybook flow stories. Runs
# inside the pinned Playwright container so Chromium + fonts match the
# committed screenshot baselines exactly. See playwright.config.ts for
# the rendering pin details.
#
# Pulls the -tags=test lace CLI binary + seed-drift canary hashes from
# a private R2 bucket published by lace-cloud/lace-cli's
# publish-test-bundle workflow. No cross-repo source checkout.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main, develop]
  workflow_call:

jobs:
  flow-tests:
    runs-on: ubuntu-latest
    # Pinned to match @playwright/test version in package.json. When
    # bumping Playwright, bump both together; mismatched versions cause
    # subtle browser-binary incompatibilities.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy

    env:
      AWS_REGION: auto
      AWS_EC2_METADATA_DISABLED: 'true'

    steps:
      - uses: actions/checkout@v6

      - name: Install awscli + protoc
        # The Playwright container ships neither. awscli pulls the R2
        # bundle; protoc runs scripts/proto-gen.sh. apt-get needs no
        # sudo since this container runs as root.
        run: |
          apt-get update
          apt-get install -y awscli protobuf-compiler

      - name: Download lace test bundle from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_TEST_BUNDLE_READ_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_TEST_BUNDLE_READ_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_TEST_BUNDLE_BUCKET }}
        run: |
          mkdir -p /tmp/lace-test
          aws s3 cp "s3://$R2_BUCKET/lace-test-bundle-linux-amd64.tar.gz" \
            /tmp/bundle.tar.gz --endpoint-url "$AWS_ENDPOINT_URL"
          aws s3 cp "s3://$R2_BUCKET/lace-test-bundle-linux-amd64.tar.gz.sha256" \
            /tmp/bundle.tar.gz.sha256 --endpoint-url "$AWS_ENDPOINT_URL"
          cd /tmp && sha256sum -c bundle.tar.gz.sha256
          tar -C /tmp/lace-test -xzf /tmp/bundle.tar.gz
          install -m 0755 /tmp/lace-test/lace /usr/local/bin/lace
          lace version

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate proto
        run: pnpm proto:gen

      - name: Build extension bundles
        run: pnpm run build

      - name: Run Playwright flow tests
        env:
          CI: '1'
          # Points the seed-drift canary at the extracted bundle — the
          # .sha256 canaries live under internal/module/server/testdata/seeds/
          # within the tarball (same path as in lace-cli).
          LACE_CLI_REPO: /tmp/lace-test
        run: pnpm flow-tests

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload failed screenshots (diffs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
