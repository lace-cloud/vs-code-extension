name: CI

# Matrix of the four extension-side suites:
#   - lint        → Biome check across the workspace
#   - unit-tests  → Vitest across every package with unit tests
#   - host-e2e    → @vscode/test-electron smoke + command tests
#   - flow-tests  → Playwright golden-path screenshots (delegated to
#                   the dedicated flow-tests.yml workflow via
#                   workflow_call)
#
# Each job is isolated — they install their own dependencies + build
# their own artefacts so one failing job doesn't mask others.
#
# host-e2e + flow-tests both pull the lace CLI test binary from a
# private R2 bucket published by lace-cloud/lace-cli's
# publish-test-bundle workflow. No cross-repo source checkout.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: arduino/setup-protoc@v3
        with:
          version: '28.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate proto
        run: pnpm proto:gen
      - name: Lint
        run: pnpm run lint

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: arduino/setup-protoc@v3
        with:
          version: '28.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate proto
        run: pnpm proto:gen
      - name: Run unit tests
        run: pnpm run test:unit

  host-e2e:
    # VS Code Electron tests need a display; xvfb-run wraps the test
    # command to provide one on the headless CI host.
    runs-on: ubuntu-latest
    env:
      AWS_REGION: auto
      AWS_EC2_METADATA_DISABLED: 'true'

    steps:
      - uses: actions/checkout@v6

      - uses: arduino/setup-protoc@v3
        with:
          version: '28.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download lace test bundle from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_TEST_BUNDLE_READ_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_TEST_BUNDLE_READ_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_TEST_BUNDLE_BUCKET }}
        run: |
          mkdir -p /tmp/lace-test
          aws s3 cp "s3://$R2_BUCKET/lace-test-bundle-linux-amd64.tar.gz" \
            /tmp/bundle.tar.gz --endpoint-url "$AWS_ENDPOINT_URL"
          aws s3 cp "s3://$R2_BUCKET/lace-test-bundle-linux-amd64.tar.gz.sha256" \
            /tmp/bundle.tar.gz.sha256 --endpoint-url "$AWS_ENDPOINT_URL"
          cd /tmp && sha256sum -c bundle.tar.gz.sha256
          tar -C /tmp/lace-test -xzf /tmp/bundle.tar.gz
          sudo install -m 0755 /tmp/lace-test/lace /usr/local/bin/lace
          lace version

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate proto
        run: pnpm proto:gen

      - name: Build extension bundles
        run: pnpm run build

      - name: Install xvfb + platform packages for VS Code
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64

      - name: Cache VS Code test download
        uses: actions/cache@v4
        with:
          path: packages/host-e2e/.vscode-test
          key: vscode-test-${{ runner.os }}-stable-v1

      - name: Run host-e2e tests
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" pnpm run test:host-e2e

  flow-tests:
    uses: ./.github/workflows/flow-tests.yml
    secrets: inherit
