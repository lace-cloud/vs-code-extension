name: CI

# Fast correctness checks on every PR to develop.
#
#   lint        → Biome check across the workspace
#   unit-tests  → Vitest across every package with unit tests
#   host-e2e    → @vscode/test-electron smoke + command + cli-integration
#
# The cli-integration test in `packages/host-e2e` spawns the public
# release CLI from releases.lace.cloud and verifies the handshake +
# gRPC protocol it emits. That is the extension's real integration
# contract — the binary shipped to users. The lace-internal `-tags=test`
# bundle is lace's own concern (flow-tests with seed fixtures) and is
# not consumed here.

on:
  pull_request:
    branches: [develop]

# Supersede in-flight runs when a newer commit lands on the same PR —
# the most recent push is the only one worth learning from.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read  # @lace-cloud/* fetch from GH Packages

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint
        run: pnpm run lint

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run unit tests
        run: pnpm run test:unit

  host-e2e:
    # VS Code Electron tests need a display; xvfb-run wraps the test
    # command to provide one on the headless CI host.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/install-release-cli
        with:
          artifact: lace-cli-linux-amd64
          install-with-sudo: 'true'

      - uses: ./.github/actions/setup-workspace
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build extension bundles
        run: pnpm run build

      - name: Install xvfb + platform packages for VS Code
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64

      - name: Cache VS Code test download
        uses: actions/cache@v5
        with:
          path: packages/host-e2e/.vscode-test
          key: vscode-test-${{ runner.os }}-stable-v1

      - name: Run host-e2e tests
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" pnpm run test:host-e2e

  ci-summary:
    # Aggregator job develop's ruleset requires. Succeeds only if every
    # upstream job succeeded; fails otherwise. Keeps the ruleset stable
    # as upstream job names evolve.
    needs: [lint, unit-tests, host-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert upstream jobs succeeded
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.host-e2e.result }}" != "success" ]; then
            echo "::error::CI failed (lint=${{ needs.lint.result }}, unit-tests=${{ needs.unit-tests.result }}, host-e2e=${{ needs.host-e2e.result }})"
            exit 1
          fi
          echo "All CI jobs passed."
