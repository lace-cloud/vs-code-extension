name: CI

# Fast correctness checks on every PR to develop.
#
#   lint        → Biome check across the workspace
#   unit-tests  → Vitest across every package with unit tests
#   host-e2e    → @vscode/test-electron smoke + command tests
#
# Heavy visual regression (Playwright + Chromatic) lives in ci-visual.yml,
# which runs on push to develop after a PR merges. That keeps per-PR cycles
# fast while still gating every integrated state visually before main.
#
# host-e2e pulls the lace CLI test binary from a private R2 bucket
# published by lace-cloud/lace-cli's publish-test-bundle workflow.

on:
  pull_request:
    branches: [develop]

# Supersede in-flight runs when a newer commit lands on the same PR —
# the most recent push is the only one worth learning from.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint
        run: pnpm run lint

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run unit tests
        run: pnpm run test:unit

  host-e2e:
    # VS Code Electron tests need a display; xvfb-run wraps the test
    # command to provide one on the headless CI host.
    #
    # Skipped for Dependabot PRs. GitHub withholds Actions secrets from
    # Dependabot-opened PRs by design (prevents a compromised transitive
    # dep from exfiltrating credentials). host-e2e pulls the lace CLI
    # test bundle from a private R2 bucket — without those secrets the
    # step fails hard. Dependabot bumps only touch action refs and
    # package versions; lint + unit-tests provide sufficient signal, and
    # the first human-authored develop push after merge re-runs host-e2e
    # with full secrets before anything reaches main.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/download-lace-bundle
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-bucket: ${{ secrets.R2_TEST_BUNDLE_BUCKET }}
          r2-access-key-id: ${{ secrets.R2_TEST_BUNDLE_READ_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_TEST_BUNDLE_READ_SECRET_ACCESS_KEY }}
          install-with-sudo: 'true'

      - uses: ./.github/actions/setup-workspace
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build extension bundles
        run: pnpm run build

      - name: Install xvfb + platform packages for VS Code
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64

      - name: Cache VS Code test download
        uses: actions/cache@v4
        with:
          path: packages/host-e2e/.vscode-test
          key: vscode-test-${{ runner.os }}-stable-v1

      - name: Run host-e2e tests
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" pnpm run test:host-e2e

  ci-summary:
    # Aggregator job develop's ruleset requires. Succeeds only if every
    # upstream job succeeded; fails otherwise. Keeps the ruleset stable
    # as upstream job names evolve.
    needs: [lint, unit-tests, host-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert upstream jobs succeeded
        run: |
          # host-e2e is allowed to be 'skipped' (Dependabot PRs only).
          # lint + unit-tests must always succeed.
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             { [ "${{ needs.host-e2e.result }}" != "success" ] && [ "${{ needs.host-e2e.result }}" != "skipped" ]; }; then
            echo "::error::CI failed (lint=${{ needs.lint.result }}, unit-tests=${{ needs.unit-tests.result }}, host-e2e=${{ needs.host-e2e.result }})"
            exit 1
          fi
          echo "All CI jobs passed."
