name: CI

# Matrix of the four extension-side suites:
#   - lint        → Biome check across the workspace
#   - unit-tests  → Vitest across every package with unit tests
#   - host-e2e    → @vscode/test-electron smoke + command tests
#   - flow-tests  → Playwright golden-path screenshots (delegated to
#                   the dedicated flow-tests.yml workflow via
#                   workflow_call)
#
# Each job is isolated — they install their own dependencies + build
# their own artefacts so one failing job doesn't mask others.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate proto
        run: pnpm proto:gen
      - name: Lint
        run: pnpm run lint

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate proto
        run: pnpm proto:gen
      - name: Run unit tests
        run: pnpm run test:unit

  host-e2e:
    # VS Code Electron tests need a display; xvfb-run wraps the test
    # command to provide one on the headless CI host.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vs-code-extension
        uses: actions/checkout@v6
        with:
          path: vs-code-extension

      - name: Checkout lace-cli (for test-tag CLI build)
        uses: actions/checkout@v6
        with:
          repository: lace-cloud/lace-cli
          path: lace-cli

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build lace CLI with -tags=test
        working-directory: lace-cli
        run: |
          make build-test
          sudo install -m 0755 lace /usr/local/bin/lace
          lace version

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: vs-code-extension/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: vs-code-extension
        run: pnpm install --frozen-lockfile

      - name: Generate proto
        working-directory: vs-code-extension
        run: pnpm proto:gen

      - name: Build extension bundles
        working-directory: vs-code-extension
        run: pnpm run build

      - name: Install xvfb + platform packages for VS Code
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64

      - name: Cache VS Code test download
        uses: actions/cache@v4
        with:
          path: vs-code-extension/packages/host-e2e/.vscode-test
          key: vscode-test-${{ runner.os }}-stable-v1

      - name: Run host-e2e tests
        working-directory: vs-code-extension
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" pnpm run test:host-e2e

  flow-tests:
    uses: ./.github/workflows/flow-tests.yml
