name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Lace CLI
        run: |
          wget -q https://releases.lace.cloud/lace-cli-linux-amd64 -O lace
          chmod +x lace
          sudo mv lace /usr/local/bin/
          lace version

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Run unit tests
        run: npm run test:unit

      # E2E tests temporarily skipped: the released CLI (v1.65.1) no longer
      # includes `lace module serve`. They will be re-enabled once the engine
      # command integration is aligned.
      # - name: Run E2E tests
      #   run: npm run test:e2e

      - name: Verify version sync
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          LOCK_VERSION=$(jq -r .version package-lock.json)
          if [ "$PKG_VERSION" != "$LOCK_VERSION" ]; then
            echo "❌ Version mismatch: package.json ($PKG_VERSION) != package-lock.json ($LOCK_VERSION)"
            echo "Run: npm version $PKG_VERSION --no-git-tag-version"
            exit 1
          fi
          echo "✅ Versions synced: $PKG_VERSION"
