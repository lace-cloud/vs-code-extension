name: Release

# Triggered by a version bump landing on main (via scripts/release.sh).
# The `check-version` job detects the bump by diffing package.json
# against HEAD~1; if the version changed, the `release` job regenerates
# proto, builds, packages a .vsix, publishes to the VS Code Marketplace,
# tags the commit, and attaches the .vsix to a GitHub Release.

on:
  push:
    branches: [main]

permissions:
  contents: write  # Required to create tags and releases

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Need full history to compare versions

      - name: Check if version changed
        id: version
        run: |
          CURRENT_VERSION=$(jq -r .version package.json)
          PREVIOUS_VERSION=$(git show HEAD~1:package.json 2>/dev/null | jq -r .version || echo "0.0.0")

          echo "Current version: $CURRENT_VERSION"
          echo "Previous version: $PREVIOUS_VERSION"
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "Version changed from $PREVIOUS_VERSION to $CURRENT_VERSION"
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "Version unchanged ($CURRENT_VERSION), skipping release"
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

  release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Setup-workspace installs deps AND runs proto:gen — the latter is
      # critical: generated proto is gitignored, so rspack (invoked by
      # vsce:prepublish) would fail on missing imports without it.
      - uses: ./.github/actions/setup-workspace
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build extension bundles
        run: pnpm run build

      - name: Package .vsix
        # --no-dependencies: vsce assumes npm and would try to re-run
        # `npm install` against our pnpm workspace, which fails.
        run: npx @vscode/vsce package --no-dependencies --out lace-cloud.vsix

      - name: Create Git tag
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish --packagePath lace-cloud.vsix --no-dependencies
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: Release v${{ needs.check-version.outputs.version }}
          files: lace-cloud.vsix
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
