name: Setup Workspace
description: Install pnpm, Node, and project dependencies from the public npm registry.

runs:
  using: composite
  steps:
    # Version comes from package.json "packageManager" field (single
    # source of truth). Specifying it here too would cause
    # pnpm/action-setup to error with "Multiple versions of pnpm".
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
