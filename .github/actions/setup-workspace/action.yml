name: Setup Workspace
description: >
  Install pnpm, Node, and project dependencies. Auth header for
  npm.pkg.github.com (where @lace-cloud/* packages live) is wired so
  pnpm install can fetch them — public packages but the registry still
  requires a token.

inputs:
  github-token:
    description: Token used to authenticate to npm.pkg.github.com for @lace-cloud/* package downloads.
    required: true

runs:
  using: composite
  steps:
    # Version comes from package.json "packageManager" field (single
    # source of truth). Specifying it here too would cause
    # pnpm/action-setup to error with "Multiple versions of pnpm".
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.github-token }}
      run: pnpm install --frozen-lockfile
