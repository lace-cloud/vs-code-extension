syntax = "proto3";
package lace.engine;
option go_package = "lace-cli/internal/module/server/pb";

import "google/protobuf/struct.proto";
import "google/protobuf/empty.proto";

// ============================================================================
// Service
// ============================================================================

service LaceEngine {
  // Lifecycle
  rpc Initialize(InitializeRequest) returns (InitializeResponse);
  rpc Shutdown(google.protobuf.Empty) returns (ShutdownResponse);

  // Auth
  rpc AuthStatus(google.protobuf.Empty) returns (AuthStatusResponse);
  rpc AuthLogin(AuthLoginRequest) returns (AuthLoginResponse);
  rpc AuthLogout(google.protobuf.Empty) returns (AuthLogoutResponse);

  // Registry
  rpc RegistryList(RegistryListRequest) returns (RegistryListResponse);
  rpc RegistryGet(RegistryGetRequest) returns (RegistryGetResponse);
  rpc RegistryVersion(RegistryVersionRequest) returns (RegistryVersionResponse);

  // Session
  rpc SessionOpen(SessionOpenRequest) returns (CanvasView);
  rpc SessionSave(google.protobuf.Empty) returns (SessionSaveResponse);
  rpc SessionClose(google.protobuf.Empty) returns (SessionCloseResponse);
  rpc SessionGenerate(SessionGenerateRequest) returns (SessionGenerateResponse);

  // Actions (mutate workspace, return new canvas view)
  rpc DropBundle(DropBundleRequest) returns (CanvasView);
  rpc Connect(ConnectRequest) returns (CanvasView);
  rpc AutoConnect(AutoConnectRequest) returns (CanvasView);
  rpc Disconnect(DisconnectRequest) returns (CanvasView);
  rpc UpdateInput(UpdateInputRequest) returns (CanvasView);
  rpc UpdateAllInputs(UpdateAllInputsRequest) returns (CanvasView);
  rpc RenameInstance(RenameInstanceRequest) returns (CanvasView);
  rpc DeleteInstance(DeleteInstanceRequest) returns (CanvasView);
  rpc CopyInstances(CopyInstancesRequest) returns (CanvasView);
  rpc SyncLayout(SyncLayoutRequest) returns (google.protobuf.Empty);
  rpc CreateGroup(CreateGroupRequest) returns (CanvasView);
  rpc UpdateGroup(UpdateGroupRequest) returns (CanvasView);
  rpc DeleteGroup(DeleteGroupRequest) returns (CanvasView);
  rpc SetVariables(SetVariablesRequest) returns (CanvasView);
  rpc SetExports(SetExportsRequest) returns (CanvasView);
  rpc SetTerraform(SetTerraformRequest) returns (google.protobuf.Empty);
  rpc SetProviders(SetProvidersRequest) returns (google.protobuf.Empty);
  rpc SetLocals(SetLocalsRequest) returns (CanvasView);
  rpc SetDependsOn(SetDependsOnRequest) returns (google.protobuf.Empty);
  rpc SetEnvironments(SetEnvironmentsRequest) returns (google.protobuf.Empty);
  rpc Undo(google.protobuf.Empty) returns (CanvasView);
  rpc Redo(google.protobuf.Empty) returns (CanvasView);

  // Queries (read-only projections)
  rpc QueryNodeConfig(NodeConfigRequest) returns (NodeConfig);
  rpc QueryEdgeConfig(EdgeConfigRequest) returns (EdgeConfig);
  rpc QuerySettings(google.protobuf.Empty) returns (SettingsConfig);
  rpc QueryGraphSummary(google.protobuf.Empty) returns (GraphSummaryResponse);
  rpc QueryValidate(google.protobuf.Empty) returns (ValidateResponse);
}

// ============================================================================
// Enums
// ============================================================================

enum NodeKind {
  NODE_KIND_UNSPECIFIED = 0;
  NODE_KIND_MODULE = 1;
  NODE_KIND_RESOURCE = 2;
  NODE_KIND_DATA = 3;
}

enum InputMode {
  INPUT_MODE_UNSPECIFIED = 0;
  INPUT_MODE_EMPTY = 1;
  INPUT_MODE_LITERAL = 2;
  INPUT_MODE_VARIABLE = 3;
  INPUT_MODE_EXPRESSION = 4;
  INPUT_MODE_WIRED = 5;
}

enum DiagnosticSeverity {
  DIAGNOSTIC_SEVERITY_UNSPECIFIED = 0;
  DIAGNOSTIC_SEVERITY_ERROR = 1;
  DIAGNOSTIC_SEVERITY_WARNING = 2;
  DIAGNOSTIC_SEVERITY_INFO = 3;
}

// ============================================================================
// Lifecycle
// ============================================================================

message InitializeRequest {
  string client_version = 1;
  string protocol_version = 2;
}

message InitializeResponse {
  string server_version = 1;
  repeated string capabilities = 2;
  string protocol_version = 3;
  repeated string supported_protocols = 4;
}

message ShutdownResponse {
  string status = 1;
}

// ============================================================================
// Auth
// ============================================================================

message OrgMembership {
  string slug = 1;
  string name = 2;
  string role = 3;
}

message AuthStatusResponse {
  bool authenticated = 1;
  string user_id = 2;
  string user_email = 3;
  string user_name = 4;
  string base_url = 5;
  repeated OrgMembership orgs = 6;
}

message AuthLoginRequest {
  string token = 1;
}

message AuthLoginResponse {
  bool success = 1;
  string user_id = 2;
  string user_email = 3;
  string user_name = 4;
  string error = 5;
}

message AuthLogoutResponse {
  bool success = 1;
}

// ============================================================================
// Registry
// ============================================================================

message RegistryListRequest {
  string system = 1;
  string search = 2;
  string category = 3;
  string kind = 4;
  int32 page = 5;
  int32 limit = 6;
  string organization = 7;
}

message RegistryListResponse {
  repeated RegistryModuleEntry modules = 1;
  int32 page = 2;
  int32 limit = 3;
  int32 total = 4;
}

message RegistryModuleEntry {
  string id = 1;
  string name = 2;
  string system = 3;
  string version = 4;
  repeated string categories = 5;
  string description = 6;
  string icon_url = 7;
}

message RegistryGetRequest {
  string name = 1;
  string system = 2;
  string organization = 3;
}

message RegistryGetResponse {
  string name = 1;
  string system = 2;
  repeated RegistryVersionEntry versions = 3;
}

message RegistryVersionEntry {
  string version = 1;
  string description = 2;
}

message RegistryVersionRequest {
  string name = 1;
  string system = 2;
  string version = 3;
  string organization = 4;
}

message RegistryVersionResponse {
  string name = 1;
  string system = 2;
  string version = 3;
  bytes deploy_bundle = 4;
  ModuleInterface module_interface = 5;
  string description = 6;
}

// ModuleInterface exposes the entry module's inputs/outputs without
// requiring the client to decode the opaque deploy_bundle bytes.
message ModuleInterface {
  repeated InterfaceField inputs = 1;
  repeated InterfaceField outputs = 2;
}

message InterfaceField {
  string name = 1;
  string type = 2;
  bool required = 3;
  string description = 4;
  google.protobuf.Value default_value = 5;
  bool sensitive = 6;
}

// ============================================================================
// Session
// ============================================================================

message SessionOpenRequest {
  string file_path = 1;
  string workspace_name = 2;
}

message SessionSaveResponse {
  bool saved = 1;
}

message SessionCloseResponse {
  string status = 1;
}

message SessionGenerateRequest {
  string output_dir = 1;
  bool dry_run = 2;
  bool format = 3;
  bool validate = 4;
  bool overwrite = 5;
}

message SessionGenerateResponse {
  repeated string files_written = 1;
  map<string, string> files = 2;
  repeated Diagnostic diagnostics = 3;
}

message Diagnostic {
  DiagnosticSeverity severity = 1;
  string message = 2;
  string file = 3;
  int32 line = 4;
  int32 column = 5;
}

// ============================================================================
// Actions
// ============================================================================

message DropBundleRequest {
  bytes deploy_bundle = 1;
  Position position = 2;
  string organization = 3;
}

message ConnectRequest {
  string source = 1;
  string target = 2;
  string source_output = 3;
  string target_input = 4;
}

message AutoConnectRequest {
  string source = 1;
  string target = 2;
}

message DisconnectRequest {
  string target = 1;
  string input_name = 2;
}

message UpdateInputRequest {
  string instance_id = 1;
  string input_name = 2;
  InputMode mode = 3;
  google.protobuf.Value value = 4;
  string variable = 5;
  string expression = 6;
}

message InputEntry {
  string name = 1;
  InputMode mode = 2;
  google.protobuf.Value value = 3;
  string variable = 4;
  string expression = 5;
}

message UpdateAllInputsRequest {
  string instance_id = 1;
  repeated InputEntry inputs = 2;
}

message RenameInstanceRequest {
  string old_id = 1;
  string new_id = 2;
}

message DeleteInstanceRequest {
  string instance_id = 1;
}

message CopyInstancesRequest {
  repeated string instance_ids = 1;
}

message SyncLayoutRequest {
  map<string, Position> positions = 1;
}

message CreateGroupRequest {
  string label = 1;
  repeated string node_ids = 2;
}

message UpdateGroupRequest {
  string group_id = 1;
  string label = 2;
  repeated string node_ids = 3;
  bool collapsed = 4;
  bool has_label = 5;
  bool has_collapsed = 6;
  bool has_node_ids = 7;
}

message DeleteGroupRequest {
  string group_id = 1;
}

message SetVariablesRequest {
  repeated InputDef variables = 1;
}

message OutputExportEntry {
  string name = 1;
  string source_instance = 2;
  string source_output = 3;
}

message SetExportsRequest {
  repeated OutputExportEntry outputs = 1;
  repeated OutputDef output_defs = 2;
}

message SetTerraformRequest {
  string required_version = 1;
  repeated ProviderReqView required_providers = 2;
  BackendView backend = 3;
}

message SetProvidersRequest {
  repeated ProviderView providers = 1;
}

message LocalEntry {
  string name = 1;
  string mode = 2;
  google.protobuf.Value value = 3;
  string variable = 4;
  string expression = 5;
}

message SetLocalsRequest {
  repeated LocalEntry locals = 1;
}

message SetDependsOnRequest {
  string instance_id = 1;
  repeated string depends_on = 2;
}

message SetEnvironmentsRequest {
  map<string, google.protobuf.Struct> environments = 1;
  map<string, BackendView> environment_backends = 2;
}

// ============================================================================
// Queries
// ============================================================================

message NodeConfigRequest {
  string instance_id = 1;
}

message EdgeConfigRequest {
  string source = 1;
  string target = 2;
}

message GraphSummaryResponse {
  string text = 1;
}

message ValidateResponse {
  repeated RenderError errors = 1;
}

// ============================================================================
// Render Model (UI projections)
// ============================================================================

message CanvasView {
  string module_name = 1;
  repeated RenderNode nodes = 2;
  repeated RenderEdge edges = 3;
  repeated RenderError errors = 4;
  bool can_undo = 5;
  bool can_redo = 6;
  bool is_dirty = 7;
  repeated RenderGroup groups = 8;
}

message RenderGroup {
  string id = 1;
  string label = 2;
  repeated string node_ids = 3;
  bool collapsed = 4;
}

message RenderNode {
  string id = 1;
  string label = 2;
  NodeKind kind = 3;
  string module_key = 4;
  string icon_url = 5;
  Position position = 6;
  bool has_errors = 7;
  repeated string error_messages = 8;
  repeated NodePin inputs = 9;
  repeated NodePin outputs = 10;
}

// NodePin is a compact handle descriptor rendered on the canvas. One pin is
// emitted per input variable (left rail) and per output (right rail) so the
// webview can draw Blender-style per-variable connection handles.
message NodePin {
  string name = 1;
  string type = 2;          // HCL type string, e.g. "string", "list(object)"
  bool required = 3;        // inputs only; always false for outputs
  bool wired = 4;           // input has an Out binding, or output feeds >=1 edge
  string description = 5;
  bool sensitive = 6;       // outputs only
}

message RenderEdge {
  string id = 1;
  string source = 2;
  string target = 3;
  string source_output = 4;
  string target_input = 5;
}

message RenderInput {
  string name = 1;
  string type = 2;
  bool required = 3;
  string description = 4;
  google.protobuf.Value default_value = 5;
  ValidationBlock validation = 6;
  InputMode mode = 7;
  google.protobuf.Value value = 8;
  string variable = 9;
  string expression = 10;
  string wired_source = 11;
}

message RenderOutput {
  string name = 1;
  string type = 2;
  string description = 3;
  bool sensitive = 4;
}

message NodeConfig {
  string instance_id = 1;
  repeated RenderInput inputs = 2;
  repeated RenderOutput outputs = 3;
  repeated string sibling_ids = 4;
  repeated string depends_on = 5;
  repeated VariableRef available_variables = 6;
}

message VariableRef {
  string name = 1;
  string type = 2;
}

message EdgeConfig {
  string source_instance = 1;
  string target_instance = 2;
  repeated RenderOutput source_outputs = 3;
  repeated RenderInput target_unbound_inputs = 4;
}

message SettingsConfig {
  TerraformView terraform = 1;
  repeated ProviderView providers = 2;
  repeated LocalView locals = 3;
  map<string, google.protobuf.Struct> environments = 4;
  map<string, BackendView> environment_backends = 5;
}

message TerraformView {
  string required_version = 1;
  repeated ProviderReqView required_providers = 2;
  BackendView backend = 3;
}

message ProviderReqView {
  string name = 1;
  string source = 2;
  string version = 3;
}

message BackendView {
  string type = 1;
  map<string, google.protobuf.Value> config = 2;
}

message ProviderView {
  string name = 1;
  string alias = 2;
  map<string, google.protobuf.Value> config = 3;
}

message LocalView {
  string name = 1;
  string mode = 2;
  string value_display = 3;
}

message RenderError {
  string instance_id = 1;
  string input_name = 2;
  string message = 3;
}

// ============================================================================
// Shared types (used in action requests)
// ============================================================================

message Position {
  double x = 1;
  double y = 2;
}

message InputDef {
  string name = 1;
  string type = 2;
  bool required = 3;
  string description = 4;
  google.protobuf.Value default_value = 5;
  ValidationBlock validation = 6;
}

message ValidationBlock {
  string condition = 1;
  string error_message = 2;
}

message OutputDef {
  string name = 1;
  string type = 2;
  string description = 3;
  bool sensitive = 4;
}
