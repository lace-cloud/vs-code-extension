syntax = "proto3";
package lace.engine;
option go_package = "lace-cli/internal/module/server/pb";

import "google/protobuf/struct.proto";
import "google/protobuf/empty.proto";

// ============================================================================
// Service
// ============================================================================

service LaceEngine {
  // Lifecycle (global; no session_id)
  rpc Initialize(InitializeRequest) returns (InitializeResponse);
  rpc Shutdown(google.protobuf.Empty) returns (ShutdownResponse);

  // Auth (global; no session_id)
  rpc AuthStatus(google.protobuf.Empty) returns (AuthStatusResponse);
  rpc AuthLogin(AuthLoginRequest) returns (AuthLoginResponse);
  rpc AuthLogout(google.protobuf.Empty) returns (AuthLogoutResponse);

  // Registry (global)
  rpc RegistryList(RegistryListRequest) returns (RegistryListResponse);
  rpc RegistryGetVersions(RegistryGetVersionsRequest) returns (RegistryGetVersionsResponse);

  // Module surface (server-side orchestration; replaces DropBundle + RegistryVersion)
  rpc InspectModule(InspectModuleRequest) returns (InspectModuleResponse);
  rpc PlaceModule(PlaceModuleRequest) returns (CanvasView);

  // Session lifecycle
  rpc SessionOpen(SessionOpenRequest) returns (SessionOpenResponse);
  rpc TestSessionOpen(TestSessionOpenRequest) returns (SessionOpenResponse);
  rpc SessionSave(SessionSaveRequest) returns (SessionSaveResponse);
  rpc SessionClose(SessionCloseRequest) returns (SessionCloseResponse);
  rpc SessionGenerate(SessionGenerateRequest) returns (SessionGenerateResponse);

  // Mutations (each wraps its *Action message; response is the canvas view)
  rpc Connect(ConnectRequest) returns (CanvasView);
  rpc AutoConnect(AutoConnectRequest) returns (CanvasView);
  rpc Disconnect(DisconnectRequest) returns (CanvasView);
  rpc UpdateInput(UpdateInputRequest) returns (CanvasView);
  rpc UpdateAllInputs(UpdateAllInputsRequest) returns (CanvasView);
  rpc RenameInstance(RenameInstanceRequest) returns (CanvasView);
  rpc DeleteInstance(DeleteInstanceRequest) returns (CanvasView);
  rpc CopyInstances(CopyInstancesRequest) returns (CanvasView);
  rpc SyncLayout(SyncLayoutRequest) returns (CanvasView);
  rpc CreateGroup(CreateGroupRequest) returns (CanvasView);
  rpc UpdateGroup(UpdateGroupRequest) returns (CanvasView);
  rpc DeleteGroup(DeleteGroupRequest) returns (CanvasView);
  rpc SetVariables(SetVariablesRequest) returns (CanvasView);
  rpc SetExports(SetExportsRequest) returns (CanvasView);
  rpc SetTerraform(SetTerraformRequest) returns (CanvasView);
  rpc SetProviders(SetProvidersRequest) returns (CanvasView);
  rpc SetLocals(SetLocalsRequest) returns (CanvasView);
  rpc SetDependsOn(SetDependsOnRequest) returns (CanvasView);
  rpc SetEnvironments(SetEnvironmentsRequest) returns (CanvasView);
  rpc Undo(UndoRequest) returns (CanvasView);
  rpc Redo(RedoRequest) returns (CanvasView);

  // Batch dispatch — atomic multi-action, one undo entry, one CanvasView.
  rpc Dispatch(DispatchRequest) returns (CanvasView);

  // Queries (read-only projections)
  rpc QueryNodeConfig(NodeConfigRequest) returns (NodeConfig);
  rpc QueryEdgeConfig(EdgeConfigRequest) returns (EdgeConfig);
  rpc QuerySettings(QuerySettingsRequest) returns (SettingsConfig);
  rpc QueryGraphSummary(QueryGraphSummaryRequest) returns (GraphSummaryResponse);
  rpc QueryValidate(QueryValidateRequest) returns (ValidateResponse);

  // Server-push events scoped to one session (see Plan 0 §9).
  //
  // The server sends an initial StateUpdated event carrying the current
  // CanvasView before streaming mutation events. This gives clients
  // authoritative state + subsequent deltas in a single RPC, and acts as
  // the "subscribed" ready signal — after receiving the initial event,
  // the handler is in its select loop and future publishes are
  // guaranteed to fan out to this subscriber.
  rpc Subscribe(SubscribeRequest) returns (stream EngineEvent);
}

// ============================================================================
// Enums
// ============================================================================

enum NodeKind {
  NODE_KIND_UNSPECIFIED = 0;
  NODE_KIND_MODULE = 1;
  NODE_KIND_RESOURCE = 2;
  NODE_KIND_DATA = 3;
}

enum InputMode {
  INPUT_MODE_UNSPECIFIED = 0;
  INPUT_MODE_EMPTY = 1;
  INPUT_MODE_LITERAL = 2;
  INPUT_MODE_VARIABLE = 3;
  INPUT_MODE_EXPRESSION = 4;
  INPUT_MODE_WIRED = 5;
}

enum DiagnosticSeverity {
  DIAGNOSTIC_SEVERITY_UNSPECIFIED = 0;
  DIAGNOSTIC_SEVERITY_ERROR = 1;
  DIAGNOSTIC_SEVERITY_WARNING = 2;
  DIAGNOSTIC_SEVERITY_INFO = 3;
}

// ============================================================================
// Lifecycle
// ============================================================================

message InitializeRequest {
  string client_version = 1;
  string protocol_version = 2;
}

message InitializeResponse {
  string server_version = 1;
  repeated string capabilities = 2;
  string protocol_version = 3;
  repeated string supported_protocols = 4;
}

message ShutdownResponse {
  string status = 1;
}

// ============================================================================
// Auth
// ============================================================================

message OrgMembership {
  string slug = 1;
  string name = 2;
  string role = 3;
}

message AuthStatusResponse {
  bool authenticated = 1;
  string user_id = 2;
  string user_email = 3;
  string user_name = 4;
  string base_url = 5;
  repeated OrgMembership orgs = 6;
}

message AuthLoginRequest {
  string token = 1;
}

message AuthLoginResponse {
  bool success = 1;
  string user_id = 2;
  string user_email = 3;
  string user_name = 4;
  string error = 5;
}

message AuthLogoutResponse {
  bool success = 1;
}

// ============================================================================
// Registry
// ============================================================================

message RegistryListRequest {
  string system = 1;
  string search = 2;
  string category = 3;
  string kind = 4;
  int32 page = 5;
  int32 limit = 6;
  string organization = 7;
}

message RegistryListResponse {
  repeated RegistryModuleEntry modules = 1;
  int32 page = 2;
  int32 limit = 3;
  int32 total = 4;
}

message RegistryModuleEntry {
  string id = 1;
  string name = 2;
  string system = 3;
  string version = 4;
  repeated string categories = 5;
  string description = 6;
  string icon_url = 7;
}

message RegistryGetVersionsRequest {
  string name = 1;
  string system = 2;
  string organization = 3;
}

message RegistryGetVersionsResponse {
  string name = 1;
  string system = 2;
  repeated RegistryVersionEntry versions = 3;
}

message RegistryVersionEntry {
  string version = 1;
  string description = 2;
}

// ============================================================================
// Module surface — InspectModule + PlaceModule
//
// Replaces the old (RegistryVersion -> DropBundle) round-trip. Bundle bytes
// no longer cross the wire; the server fetches, decodes, places, and
// positions. Callers receive either a module-interface projection or an
// updated CanvasView.
// ============================================================================

message InspectModuleRequest {
  string name = 1;
  string system = 2;
  string version = 3;
  string organization = 4;
}

message InspectModuleResponse {
  string name = 1;
  string system = 2;
  string version = 3;
  string description = 4;
  ModuleInterface module_interface = 5;
}

message ModuleInterface {
  repeated InterfaceField inputs = 1;
  repeated InterfaceField outputs = 2;
}

message InterfaceField {
  string name = 1;
  string type = 2;
  bool required = 3;
  string description = 4;
  google.protobuf.Value default_value = 5;
  bool sensitive = 6;
}

message PlaceModuleRequest {
  string session_id = 1;
  string name = 2;
  string system = 3;
  string version = 4;
  string organization = 5;
  Position position = 6;
}

// ============================================================================
// Session lifecycle
// ============================================================================

message SessionOpenRequest {
  oneof target {
    EphemeralSession ephemeral = 1;
    BackedSession backed = 2;
  }
  string workspace_name = 3;
}

message EphemeralSession {}

message BackedSession {
  string file_path = 1;
}

message SessionOpenResponse {
  string session_id = 1;
  CanvasView view = 2;
}

message TestSessionOpenRequest {
  string fixture_name = 1;
  string workspace_name = 2;
}

message SessionSaveRequest {
  string session_id = 1;
}

message SessionSaveResponse {
  bool saved = 1;
}

message SessionCloseRequest {
  string session_id = 1;
}

message SessionCloseResponse {
  string status = 1;
}

message SessionGenerateRequest {
  string session_id = 1;
  string output_dir = 2;
  bool dry_run = 3;
  bool format = 4;
  bool validate = 5;
  bool overwrite = 6;
}

message SessionGenerateResponse {
  repeated string files_written = 1;
  map<string, string> files = 2;
  repeated Diagnostic diagnostics = 3;
}

message Diagnostic {
  DiagnosticSeverity severity = 1;
  string message = 2;
  string file = 3;
  int32 line = 4;
  int32 column = 5;
}

// ============================================================================
// Actions — canonical payloads
//
// Each mutation has one *Action message carrying only the payload (never
// session_id). Single-action RPC requests wrap one *Action. DispatchRequest
// carries `repeated Action` where Action is a oneof over every *Action
// below. This is the "Action defined once" rule (Plan 0 §6).
// ============================================================================

message ConnectAction {
  string source = 1;
  string target = 2;
  string source_output = 3;
  string target_input = 4;
}

message AutoConnectAction {
  string source = 1;
  string target = 2;
}

message DisconnectAction {
  string target = 1;
  string input_name = 2;
}

message UpdateInputAction {
  string instance_id = 1;
  string input_name = 2;
  InputMode mode = 3;
  google.protobuf.Value value = 4;
  string variable = 5;
  string expression = 6;
}

message UpdateAllInputsAction {
  string instance_id = 1;
  repeated InputEntry inputs = 2;
}

message InputEntry {
  string name = 1;
  InputMode mode = 2;
  google.protobuf.Value value = 3;
  string variable = 4;
  string expression = 5;
}

message RenameInstanceAction {
  string old_id = 1;
  string new_id = 2;
}

message DeleteInstanceAction {
  string instance_id = 1;
}

message CopyInstancesAction {
  repeated string instance_ids = 1;
}

message SyncLayoutAction {
  map<string, Position> positions = 1;
}

message CreateGroupAction {
  string label = 1;
  repeated string node_ids = 2;
}

// UpdateGroupAction uses proto3 `optional` field presence to express partial
// updates. `node_ids` is wrapped in a message because proto3 `optional` does
// not apply to `repeated`.
message UpdateGroupAction {
  string group_id = 1;
  optional string label = 2;
  optional bool collapsed = 3;
  optional UpdateGroupNodeIds node_ids = 4;
}

message UpdateGroupNodeIds {
  repeated string node_ids = 1;
}

message DeleteGroupAction {
  string group_id = 1;
}

message SetVariablesAction {
  repeated InputDef variables = 1;
}

message SetExportsAction {
  repeated OutputExportEntry outputs = 1;
  repeated OutputDef output_defs = 2;
}

message OutputExportEntry {
  string name = 1;
  string source_instance = 2;
  string source_output = 3;
}

message SetTerraformAction {
  string required_version = 1;
  repeated ProviderReqView required_providers = 2;
  BackendView backend = 3;
}

message SetProvidersAction {
  repeated ProviderView providers = 1;
}

message SetLocalsAction {
  repeated LocalEntry locals = 1;
}

message LocalEntry {
  string name = 1;
  string mode = 2;
  google.protobuf.Value value = 3;
  string variable = 4;
  string expression = 5;
}

message SetDependsOnAction {
  string instance_id = 1;
  repeated string depends_on = 2;
}

message SetEnvironmentsAction {
  map<string, google.protobuf.Struct> environments = 1;
  map<string, BackendView> environment_backends = 2;
}

// The canonical Action type used inside DispatchRequest.
message Action {
  oneof action {
    ConnectAction connect = 1;
    AutoConnectAction auto_connect = 2;
    DisconnectAction disconnect = 3;
    UpdateInputAction update_input = 4;
    UpdateAllInputsAction update_all_inputs = 5;
    RenameInstanceAction rename_instance = 6;
    DeleteInstanceAction delete_instance = 7;
    CopyInstancesAction copy_instances = 8;
    SyncLayoutAction sync_layout = 9;
    CreateGroupAction create_group = 10;
    UpdateGroupAction update_group = 11;
    DeleteGroupAction delete_group = 12;
    SetVariablesAction set_variables = 13;
    SetExportsAction set_exports = 14;
    SetTerraformAction set_terraform = 15;
    SetProvidersAction set_providers = 16;
    SetLocalsAction set_locals = 17;
    SetDependsOnAction set_depends_on = 18;
    SetEnvironmentsAction set_environments = 19;
  }
}

// ============================================================================
// Single-action RPC requests — each wraps one *Action + session_id
// ============================================================================

message ConnectRequest {
  string session_id = 1;
  ConnectAction connect = 2;
}

message AutoConnectRequest {
  string session_id = 1;
  AutoConnectAction auto_connect = 2;
}

message DisconnectRequest {
  string session_id = 1;
  DisconnectAction disconnect = 2;
}

message UpdateInputRequest {
  string session_id = 1;
  UpdateInputAction update_input = 2;
}

message UpdateAllInputsRequest {
  string session_id = 1;
  UpdateAllInputsAction update_all_inputs = 2;
}

message RenameInstanceRequest {
  string session_id = 1;
  RenameInstanceAction rename_instance = 2;
}

message DeleteInstanceRequest {
  string session_id = 1;
  DeleteInstanceAction delete_instance = 2;
}

message CopyInstancesRequest {
  string session_id = 1;
  CopyInstancesAction copy_instances = 2;
}

message SyncLayoutRequest {
  string session_id = 1;
  SyncLayoutAction sync_layout = 2;
}

message CreateGroupRequest {
  string session_id = 1;
  CreateGroupAction create_group = 2;
}

message UpdateGroupRequest {
  string session_id = 1;
  UpdateGroupAction update_group = 2;
}

message DeleteGroupRequest {
  string session_id = 1;
  DeleteGroupAction delete_group = 2;
}

message SetVariablesRequest {
  string session_id = 1;
  SetVariablesAction set_variables = 2;
}

message SetExportsRequest {
  string session_id = 1;
  SetExportsAction set_exports = 2;
}

message SetTerraformRequest {
  string session_id = 1;
  SetTerraformAction set_terraform = 2;
}

message SetProvidersRequest {
  string session_id = 1;
  SetProvidersAction set_providers = 2;
}

message SetLocalsRequest {
  string session_id = 1;
  SetLocalsAction set_locals = 2;
}

message SetDependsOnRequest {
  string session_id = 1;
  SetDependsOnAction set_depends_on = 2;
}

message SetEnvironmentsRequest {
  string session_id = 1;
  SetEnvironmentsAction set_environments = 2;
}

message UndoRequest {
  string session_id = 1;
}

message RedoRequest {
  string session_id = 1;
}

message DispatchRequest {
  string session_id = 1;
  repeated Action actions = 2;
}

// ============================================================================
// Queries
// ============================================================================

message NodeConfigRequest {
  string session_id = 1;
  string instance_id = 2;
}

message EdgeConfigRequest {
  string session_id = 1;
  string source = 2;
  string target = 3;
}

message QuerySettingsRequest {
  string session_id = 1;
}

message QueryGraphSummaryRequest {
  string session_id = 1;
}

message QueryValidateRequest {
  string session_id = 1;
}

message GraphSummaryResponse {
  string text = 1;
}

message ValidateResponse {
  repeated RenderError errors = 1;
}

// ============================================================================
// Subscribe — server-pushed events scoped to one session
// ============================================================================

message SubscribeRequest {
  string session_id = 1;
}

message EngineEvent {
  oneof event {
    StateUpdated state_updated = 1;
    GenerateProgress generate_progress = 2;
    GenerateSuccess generate_success = 3;
    GenerateError generate_error = 4;
  }
}

message StateUpdated {
  CanvasView view = 1;
}

message GenerateProgress {
  string stage = 1;
  string message = 2;
}

message GenerateSuccess {
  repeated string files_written = 1;
  map<string, string> files = 2;
}

message GenerateError {
  string message = 1;
  repeated Diagnostic diagnostics = 2;
}

// ============================================================================
// Render Model (UI projections)
// ============================================================================

message CanvasView {
  string module_name = 1;
  repeated RenderNode nodes = 2;
  repeated RenderEdge edges = 3;
  repeated RenderError errors = 4;
  bool can_undo = 5;
  bool can_redo = 6;
  bool is_dirty = 7;
  repeated RenderGroup groups = 8;
}

// RenderGroup represents a composite module instance on the canvas.
// A group IS a composite IS a Terraform module — one concept, three names.
//
// Every composite instance projects as a RenderGroup:
//   - Registry-dropped composites (e.g. iam_stack): module_key points at the
//     bundle source; inputs/outputs mirror the composite's published interface.
//   - User-created composites (via "Group" canvas action): module_key is empty
//     (local source); inputs/outputs computed from crossing edges.
//
// Groups arrive collapsed (collapsed=true) across all creation paths for
// consistency. Expand/collapse is a pure view toggle that never changes the
// IR or generated .tf — ungroup is the destructive dissolve action.
message RenderGroup {
  string id = 1;
  string label = 2;
  repeated string node_ids = 3;
  bool collapsed = 4;
  // Bundle source identifier (e.g. "aws/examples/iam_stack@v1.0.0") for
  // composites dropped from the registry; empty for user-created locals.
  string module_key = 5;
  // Boundary input pins — what the composite accepts from its parent scope.
  // Rendered on the left rail when collapsed; derived from the composite's
  // Interface.Inputs or the crossing edges for user-created groups.
  repeated NodePin inputs = 6;
  // Boundary output pins — what the composite exposes to its parent scope.
  // Rendered on the right rail when collapsed; derived from the composite's
  // Exports or outgoing crossing edges.
  repeated NodePin outputs = 7;
}

message RenderNode {
  string id = 1;
  string label = 2;
  NodeKind kind = 3;
  string module_key = 4;
  string icon_url = 5;
  Position position = 6;
  bool has_errors = 7;
  repeated string error_messages = 8;
  repeated NodePin inputs = 9;
  repeated NodePin outputs = 10;
}

// NodePin is a compact handle descriptor rendered on the canvas. One pin is
// emitted per input variable (left rail) and per output (right rail) so the
// webview can draw Blender-style per-variable connection handles.
message NodePin {
  string name = 1;
  string type = 2;          // HCL type string, e.g. "string", "list(object)"
  bool required = 3;        // inputs only; always false for outputs
  bool wired = 4;           // input has an Out binding, or output feeds >=1 edge
  string description = 5;
  bool sensitive = 6;       // outputs only
}

message RenderEdge {
  string id = 1;
  string source = 2;
  string target = 3;
  string source_output = 4;
  string target_input = 5;
}

message RenderInput {
  string name = 1;
  string type = 2;
  bool required = 3;
  string description = 4;
  google.protobuf.Value default_value = 5;
  ValidationBlock validation = 6;
  InputMode mode = 7;
  google.protobuf.Value value = 8;
  string variable = 9;
  string expression = 10;
  string wired_source = 11;
}

message RenderOutput {
  string name = 1;
  string type = 2;
  string description = 3;
  bool sensitive = 4;
}

message NodeConfig {
  string instance_id = 1;
  repeated RenderInput inputs = 2;
  repeated RenderOutput outputs = 3;
  repeated string sibling_ids = 4;
  repeated string depends_on = 5;
  repeated VariableRef available_variables = 6;
}

message VariableRef {
  string name = 1;
  string type = 2;
}

message EdgeConfig {
  string source_instance = 1;
  string target_instance = 2;
  repeated RenderOutput source_outputs = 3;
  repeated RenderInput target_unbound_inputs = 4;
}

message SettingsConfig {
  TerraformView terraform = 1;
  repeated ProviderView providers = 2;
  repeated LocalView locals = 3;
  map<string, google.protobuf.Struct> environments = 4;
  map<string, BackendView> environment_backends = 5;
}

message TerraformView {
  string required_version = 1;
  repeated ProviderReqView required_providers = 2;
  BackendView backend = 3;
}

message ProviderReqView {
  string name = 1;
  string source = 2;
  string version = 3;
}

message BackendView {
  string type = 1;
  map<string, google.protobuf.Value> config = 2;
}

message ProviderView {
  string name = 1;
  string alias = 2;
  map<string, google.protobuf.Value> config = 3;
}

message LocalView {
  string name = 1;
  string mode = 2;
  string value_display = 3;
}

message RenderError {
  string instance_id = 1;
  string input_name = 2;
  string message = 3;
}

// ============================================================================
// Shared types
// ============================================================================

message Position {
  double x = 1;
  double y = 2;
}

message InputDef {
  string name = 1;
  string type = 2;
  bool required = 3;
  string description = 4;
  google.protobuf.Value default_value = 5;
  ValidationBlock validation = 6;
}

message ValidationBlock {
  string condition = 1;
  string error_message = 2;
}

message OutputDef {
  string name = 1;
  string type = 2;
  string description = 3;
  bool sensitive = 4;
}
